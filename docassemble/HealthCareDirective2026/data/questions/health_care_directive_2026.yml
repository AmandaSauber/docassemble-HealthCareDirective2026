metadata:
  title: >-
    Health Care Directive 2026
  short title: >-
    Health Care Directive 202
  description: |-
    This Health Care Directive allows you to appoint a health care agent to make decisions on your behalf if you are unable to do so. You can also provide specific health care instructions to guide your agent and health care providers. This document ensures your wishes are followed regarding medical treatments, end-of-life decisions, and more. It is an important step in planning for your future health care needs.
  can_I_use_this_form: |
    This form is for anyone who wants to ensure their health care preferences are respected. It's especially useful if you want someone to make decisions for you if you're unable to do so.
  before_you_start: |
    ### Before you get started
    - Gather information about who you want to appoint as your health care agent.
    - Think about your health care preferences and values.
    
    ### When you are finished
    - Sign and date the document.
    - Have it witnessed or notarized as required.
  when_you_are_finished: |
    After completing the Health Care Directive, keep it in a safe place and share copies with your health care agent, family, and medical providers. Ensure that your doctor is aware of your directive and willing to follow your wishes. Regularly review and update the document as needed.
